image: Visual Studio 2022
environment:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
build_script:
- pwsh: |
    # Install bundled fonts (direct copy avoids COM Shell hangs on CI)
    $fontsPath = "src/Fonts"
    $winFonts = "$env:WINDIR\Fonts"
    $regKey = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Fonts"
    Get-ChildItem -Path $fontsPath -Include *.ttf,*.otf -Recurse | ForEach-Object {
        Copy-Item $_.FullName -Destination $winFonts -Force
        $fontName = [System.IO.Path]::GetFileNameWithoutExtension($_.Name)
        $fontType = if ($_.Extension -eq ".otf") { "OpenType" } else { "TrueType" }
        New-ItemProperty -Path $regKey -Name "$fontName ($fontType)" -Value $_.Name -PropertyType String -Force | Out-Null
    }
- pwsh: |
    Invoke-WebRequest "https://dot.net/v1/dotnet-install.ps1" -OutFile "./dotnet-install.ps1"
    ./dotnet-install.ps1 -JSonFile src/global.json -Architecture x64 -InstallDir 'C:\Program Files\dotnet'
- dotnet build src --configuration Release
- dotnet test src --configuration Release --no-build --no-restore
test: off
on_failure:
  - ps: Get-ChildItem *.received.* -recurse | % { Push-AppveyorArtifact $_.FullName -FileName $_.Name }
artifacts:
- path: nugets\*.nupkg